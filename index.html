<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <script>
      // One address for the app. Google sign-in is allowed only on the address set up in Firebase, and
      // progress and the offline copy are kept per address; the second Vercel project's address (the
      // link on GitHub) sends everyone to the main one, keeping the screen they asked for.
      if (location.hostname === 'system-analysis-learning-game.vercel.app') location.replace('https://parcelgo-system-design.vercel.app/' + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="theme-color" content="#16252D" />
    <title>ParcelGo · System design শেখার খেলা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
    <script>
      // light or dark before the first paint (the same rule as src/shared/lib/theme.ts, default light)
      try {
        var t = (JSON.parse(localStorage.getItem('salg-progress') || '{}').state || {}).settings;
        t = (t && t.theme) || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
